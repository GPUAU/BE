apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: u1-3
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: backend
          image: IMAGE_PLACEHOLDER
          ports:
            - name: http
              containerPort: 8080
            - name: metrics          # Actuator 관리 포트 (health·prometheus만)
              containerPort: 8081
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: deploy
            - name: RDS_JDBC_URL
              valueFrom:
                secretKeyRef:
                  name: rds-credentials
                  key: SPRING_DATASOURCE_URL
            - name: RDS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rds-credentials
                  key: SPRING_DATASOURCE_USERNAME
            - name: RDS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rds-credentials
                  key: SPRING_DATASOURCE_PASSWORD
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              # 팀 쿼터 limits.cpu 4 (2026-11-24 4x8로 증설): FE 250m + BE 1 + 롤링 업데이트용 새 BE 1 = 2.25
              cpu: "1"
              memory: 1Gi
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: u1-3
  labels:
    app: backend
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: metrics
      port: 8081
      targetPort: 8081
