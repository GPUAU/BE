spring:
  profiles:
    default: local
  application:
    name: gpu-market-backend
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

# JSON 응답 압축: 가격 이력처럼 큰 응답(수십 MB)의 전송량을 줄인다. 작은 응답은 압축하지 않는다.
server:
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 2KB

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 운영 지표: health(프로브)·prometheus(Grafana 수집)만 노출한다.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
